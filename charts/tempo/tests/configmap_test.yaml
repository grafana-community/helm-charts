# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: tempo config
templates:
  - configmap-tempo.yaml
tests:
  - it: should not render the config blocks that Tempo 3.0 removed
    asserts:
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "(?m)^ingester:"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "(?m)^compactor:"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "traces_storage:"

  - it: should render the retention under the backend scheduler
    set:
      tempo.retention: 72h
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "(?s)backend_scheduler:.*block_retention: 72h"

  - it: should omit the live_store block when no settings are given
    asserts:
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "(?m)^live_store:"

  - it: should render the live_store block when settings are given
    set:
      tempo.liveStore:
        max_block_duration: 45s
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "(?s)live_store:\\s+max_block_duration: 45s"

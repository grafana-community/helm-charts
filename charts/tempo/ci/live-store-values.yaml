# Exercises the Tempo 3.0 config blocks that replaced the ingester and the compactor.
persistence:
  enabled: true
  size: 1Gi

tempo:
  retention: 48h
  liveStore:
    max_block_duration: 45s
    complete_block_timeout: 10m
  backendScheduler:
    provider:
      compaction:
        max_input_blocks: 3
  backendWorker:
    compaction:
      compaction_window: 30m

# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: secret checksum annotation
templates:
  - deployment.yaml

tests:
  - it: does not hash the generated admin password on install
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/secret"]
          value: 41d33daaaf9e1b9fda4858a616a6befa68227ea321c3292a81630d22060c377b

  - it: keeps the same hash once the generated password is read back on upgrade
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: RELEASE-NAME-grafana
            namespace: NAMESPACE
          data:
            admin-user: YWRtaW4=
            admin-password: c3RvcmVkLXBhc3N3b3Jk
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/secret"]
          value: 41d33daaaf9e1b9fda4858a616a6befa68227ea321c3292a81630d22060c377b

  - it: changes the hash when adminPassword is set
    set:
      adminPassword: changed
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/secret"]
          value: 41d33daaaf9e1b9fda4858a616a6befa68227ea321c3292a81630d22060c377b

{{- if and .Values.rbac.create (or (not .Values.rbac.namespaced) .Values.rbac.extraClusterRoleRules) (not .Values.rbac.useExistingClusterRole) }}
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ include "grafana.fullname" . }}-clusterrole
{{- $sidecarResources := include "grafana.sidecarResources" . }}
{{- if or $sidecarResources .Values.rbac.extraClusterRoleRules }}
rules:
  {{- with $sidecarResources }}
  - apiGroups: [""] # "" indicates the core API group
    resources: {{ splitList "," . | toJson }}
    verbs: ["get", "watch", "list"]
  {{- end }}
  {{- with .Values.rbac.extraClusterRoleRules }}
  {{- toYaml . | nindent 2 }}
  {{- end}}
{{- else }}
rules: []
{{- end}}
{{- end}}

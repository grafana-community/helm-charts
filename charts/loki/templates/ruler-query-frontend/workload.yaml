{{- $isDistributed := eq (include "loki.deployment.isDistributed" .) "true" -}}
{{- if and $isDistributed .Values.ruler.enabled .Values.ruler.remoteEvaluationDedicatedQueryPath .Values.rulerQueryFrontend.enabled -}}
{{- $args := list
  "-querier.cache-results=false"
  (printf "-frontend.scheduler-address=%s" (include "loki.rulerQuerySchedulerAddress" .))
  (printf "-frontend.tail-proxy-url=%s" (include "loki.rulerQuerierAddress" .))
  "-query-scheduler.ring.prefix=ruler-query-scheduler/"
  "-server.grpc.keepalive.max-connection-age=30s"
  "-shutdown-delay=90s"
}}
{{- include "loki.component" (dict "ctx" . "component" .Values.rulerQueryFrontend "target" "ruler-query-frontend" "args" $args "memberlist" false) }}
{{- end }}

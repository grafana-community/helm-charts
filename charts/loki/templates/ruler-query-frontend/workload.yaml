{{- if eq (include "loki.ruler.dedicatedQueryPathEnabled" .) "true" -}}
{{- $args := list
  "-querier.cache-instant-metric-results=false"
  (printf "-frontend.scheduler-address=%s" (include "loki.rulerQuerySchedulerAddress" .))
  "-query-scheduler.ring.prefix=ruler-query-scheduler/"
  "-server.grpc.keepalive.max-connection-age=30s"
  "-shutdown-delay=90s"
}}
{{- include "loki.component" (dict "ctx" . "component" .Values.rulerQueryFrontend "target" "ruler-query-frontend" "lokiTarget" "query-frontend" "args" $args "memberlist" false) }}
{{- end }}

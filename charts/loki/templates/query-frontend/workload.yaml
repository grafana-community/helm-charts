{{- $isDistributed := eq (include "loki.deployment.isDistributed" .) "true" -}}
{{- if $isDistributed -}}
{{- $args := list }}
{{- if .Values.loki.logline.query.enabled }}
{{- $args = concat (list (include "loki.logline.minDateArg" .) "-logline-query.enabled=true") (.Values.loki.logline.extraArgs | default list) }}
{{- end }}
{{- include "loki.component" (dict "ctx" . "component" .Values.queryFrontend "target" "query-frontend" "memberlist" false "args" $args) }}
{{- end }}

{{- $releaseNamespace := include "loki.namespace" . }}
{{- $sidecarNamespaces := splitList "," (include "loki.rulesSidecar.roleNamespaces" .) | compact }}
{{- $namespaces := $sidecarNamespaces }}
{{- if .Values.rbac.sccEnabled }}
{{- $namespaces = prepend $namespaces $releaseNamespace | uniq }}
{{- end }}
{{- range $namespace := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "loki.fullname" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "loki.labels" $ | nindent 4 }}
rules:
  {{- if and $.Values.rbac.sccEnabled (eq $namespace $releaseNamespace) }}
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    verbs:
      - use
    resourceNames:
      - {{ include "loki.fullname" $ }}
  {{- end }}
  {{- if has $namespace $sidecarNamespaces }}
  - apiGroups: [""] # "" indicates the core API group
    resources: {{ splitList "," (include "loki.rulesSidecar.resources" $) | toJson }}
    verbs: ["get", "watch", "list"]
  {{- end }}
{{- end }}

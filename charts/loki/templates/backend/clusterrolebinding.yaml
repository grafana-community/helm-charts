{{- $clusterWide := eq (include "loki.rulesSidecar.clusterWide" .) "true" -}}
{{- if and (not .Values.rbac.namespaced) (or $clusterWide .Values.rbac.useExistingRole) }}
{{- $serviceAccounts := include "loki.rulesSidecar.serviceAccounts" . | default (include "loki.serviceAccountName" (dict "ctx" . "component" .Values.backend "target" "backend")) }}
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ template "loki.fullname" . }}-clusterrolebinding
  labels:
    {{- include "loki.labels" . | nindent 4 }}
{{- with .Values.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
subjects:
  {{- range splitList "," $serviceAccounts }}
  - kind: ServiceAccount
    name: {{ . }}
    namespace: {{ include "loki.namespace" $ }}
  {{- end }}
roleRef:
  kind: ClusterRole
{{- if (not .Values.rbac.useExistingRole) }}
  name: {{ template "loki.fullname" . }}-clusterrole
{{- else }}
  name: {{ .Values.rbac.useExistingRole }}
{{- end }}
  apiGroup: rbac.authorization.k8s.io
{{- end -}}

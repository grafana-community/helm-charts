# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: RustFS CI storage schemas
templates:
  - config.yaml

tests:
  - it: should use the S3 schema for default-ssd CI values
    values:
      - ../ci/default-ssd-values.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '(?ms)^schema_config:\n  configs:\n.*?^    object_store: s3$'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: '(?m)^    object_store: .*filesystem.*$'

  - it: should use the S3 schema for default CI values
    values:
      - ../ci/default-values.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '(?ms)^schema_config:\n  configs:\n.*?^    object_store: s3$'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: '(?m)^    object_store: .*filesystem.*$'


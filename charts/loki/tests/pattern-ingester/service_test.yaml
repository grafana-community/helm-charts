# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: pattern ingester service
templates:
  - pattern-ingester/service.yaml
  - pattern-ingester/workload.yaml
  - config.yaml

set:
  deploymentMode: Distributed
  loki.useTestSchema: true
  loki.storage.bucketNames.chunks: chunks
  loki.storage.bucketNames.ruler: ruler

tests:
  - it: does not render services when pattern ingester is disabled
    asserts:
      - template: pattern-ingester/service.yaml
        hasDocuments:
          count: 0

  - it: renders a service selected by the ServiceMonitor
    set:
      patternIngester.enabled: true
      patternIngester.replicas: 1
    asserts:
      - template: pattern-ingester/service.yaml
        hasDocuments:
          count: 2
      - template: pattern-ingester/service.yaml
        documentIndex: 0
        equal:
          path: metadata.name
          value: RELEASE-NAME-loki-pattern-ingester
      - template: pattern-ingester/service.yaml
        documentIndex: 0
        notExists:
          path: metadata.labels["prometheus.io/service-monitor"]
      - template: pattern-ingester/service.yaml
        documentIndex: 0
        equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: pattern-ingester

  - it: renders the headless service referenced by the StatefulSet
    set:
      patternIngester.enabled: true
      patternIngester.replicas: 1
    asserts:
      - template: pattern-ingester/service.yaml
        documentIndex: 1
        equal:
          path: metadata.name
          value: RELEASE-NAME-loki-pattern-ingester-headless
      - template: pattern-ingester/workload.yaml
        equal:
          path: spec.serviceName
          value: RELEASE-NAME-loki-pattern-ingester-headless

  - it: sets appProtocol from service.appProtocol.grpc
    set:
      patternIngester.enabled: true
      patternIngester.replicas: 1
      patternIngester.service.appProtocol.grpc: grpc
    asserts:
      - template: pattern-ingester/service.yaml
        equal:
          path: spec.ports[?(@.name == "grpc")].appProtocol
          value: grpc

  - it: prefers the deprecated appProtocol.grpc when both are set
    set:
      patternIngester.enabled: true
      patternIngester.replicas: 1
      patternIngester.appProtocol.grpc: h2c
      patternIngester.service.appProtocol.grpc: grpc
    asserts:
      - template: pattern-ingester/service.yaml
        equal:
          path: spec.ports[?(@.name == "grpc")].appProtocol
          value: h2c

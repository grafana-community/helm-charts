# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: ingester zone-aware ZoneAwarePodDisruptionBudget
templates:
  - templates/ingester/zpdb-zone.yaml
set:
  deploymentMode: Distributed
  loki.useTestSchema: true
  loki.storage.bucketNames.chunks: chunks
  loki.storage.bucketNames.ruler: ruler
  ingester.zoneAwareReplication.enabled: true
  ingester.replicas: 6
  ingester.podDisruptionBudget.enabled: true
  rollout_operator.enabled: true
tests:
  - it: should be disabled by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when explicitly enabled
    set:
      ingester.zoneAwareReplication.podDisruptionBudget.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isAPIVersion:
          of: rollout-operator.grafana.com/v1
      - isKind:
          of: ZoneAwarePodDisruptionBudget

  - it: should not render when the native PDB master switch is disabled
    set:
      ingester.podDisruptionBudget.enabled: false
      ingester.zoneAwareReplication.podDisruptionBudget.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render for a single replica
    set:
      ingester.replicas: 1
      ingester.zoneAwareReplication.podDisruptionBudget.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render outside Distributed mode
    set:
      deploymentMode: SimpleScalable
      ingester.zoneAwareReplication.podDisruptionBudget.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when the ingester is disabled
    set:
      ingester.enabled: false
      ingester.zoneAwareReplication.podDisruptionBudget.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render without zone-aware replication
    set:
      ingester.zoneAwareReplication.enabled: false
      ingester.zoneAwareReplication.podDisruptionBudget.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should use the native PDB name and custom metadata
    set:
      ingester.zoneAwareReplication.podDisruptionBudget.enabled: true
      ingester.podDisruptionBudget.annotations.test-annotation: annotation-value
      ingester.podDisruptionBudget.labels.test-label: label-value
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-loki-ingester-rollout
      - equal:
          path: metadata.annotations.test-annotation
          value: annotation-value
      - equal:
          path: metadata.labels.test-label
          value: label-value

  - it: should select every ingester zone in the rollout group
    set:
      ingester.zoneAwareReplication.podDisruptionBudget.enabled: true
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: loki
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: ingester
            rollout-group: ingester

  - it: should use the zone-aware rollout percentage
    set:
      ingester.zoneAwareReplication.podDisruptionBudget.enabled: true
      ingester.zoneAwareReplication.maxUnavailablePct: 40
    asserts:
      - equal:
          path: spec.maxUnavailablePercentage
          value: 40

  - it: should honor the rollout group prefix
    set:
      ingester.zoneAwareReplication.podDisruptionBudget.enabled: true
      ingester.rolloutGroupPrefix: production
    asserts:
      - equal:
          path: spec.selector.matchLabels.rollout-group
          value: production-ingester

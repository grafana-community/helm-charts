# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: dataobj compaction worker
templates:
  - dataobj-compaction-worker/workload.yaml
  - dataobj-compaction-worker/service.yaml
  - dataobj-compaction-worker/pdb.yaml
  - dataobj-compaction-planner/service.yaml
  - validate.yaml
  - config.yaml

set:
  deploymentMode: Distributed
  loki.useTestSchema: true
  loki.storage.bucketNames.chunks: chunks
  loki.storage.bucketNames.ruler: ruler
  # the dataobj-compaction-worker target needs Loki 4.0+
  loki.image.tag: 4.0.0

tests:
  - it: does not render anything when the dataobj compaction worker is disabled
    asserts:
      - template: dataobj-compaction-worker/workload.yaml
        hasDocuments:
          count: 0
      - template: dataobj-compaction-worker/service.yaml
        hasDocuments:
          count: 0
      - template: dataobj-compaction-worker/pdb.yaml
        hasDocuments:
          count: 0

  - it: fails outside of distributed mode
    set:
      deploymentMode: SimpleScalable
      dataobjCompactionWorker.enabled: true
      dataobjCompactionWorker.replicas: 2
    templates:
      - validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: dataobjCompactionWorker.enabled requires deploymentMode Distributed

  - it: renders a Deployment running the dataobj-compaction-worker target
    set:
      dataobjCompactionWorker.enabled: true
      dataobjCompactionWorker.replicas: 2
    asserts:
      - template: dataobj-compaction-worker/workload.yaml
        hasDocuments:
          count: 1
      - template: dataobj-compaction-worker/workload.yaml
        isKind:
          of: Deployment
      - template: dataobj-compaction-worker/workload.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-loki-dataobj-compaction-worker
      - template: dataobj-compaction-worker/workload.yaml
        equal:
          path: spec.replicas
          value: 2
      - template: dataobj-compaction-worker/workload.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: -target=dataobj-compaction-worker

  - it: advertises the worker on the pod IP and the HTTP port
    set:
      dataobjCompactionWorker.enabled: true
      dataobjCompactionWorker.replicas: 2
      loki.server.http_listen_port: 3200
    asserts:
      - template: dataobj-compaction-worker/workload.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: -dataobj.compaction.worker.advertise-addr=[$(POD_IP)]:3200

  - it: looks up the scheduler through the headless service of the planner
    set:
      dataobjCompactionPlanner.enabled: true
      dataobjCompactionPlanner.replicas: 1
      dataobjCompactionWorker.enabled: true
      dataobjCompactionWorker.replicas: 2
      global.clusterDomain: example.local
    release:
      namespace: logging
    asserts:
      - template: dataobj-compaction-planner/service.yaml
        documentIndex: 1
        equal:
          path: metadata.name
          value: RELEASE-NAME-loki-dataobj-compaction-planner-headless
      - template: dataobj-compaction-planner/service.yaml
        documentIndex: 1
        contains:
          path: spec.ports
          content:
            name: http-metrics
            port: 3100
            targetPort: http-metrics
            protocol: TCP
      - template: dataobj-compaction-worker/workload.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: -dataobj.compaction.worker.scheduler-lookup-address=dnssrv+_http-metrics._tcp.RELEASE-NAME-loki-dataobj-compaction-planner-headless.logging.svc.example.local

  - it: is not a memberlist seed node
    set:
      dataobjCompactionWorker.enabled: true
      dataobjCompactionWorker.replicas: 2
    asserts:
      - template: dataobj-compaction-worker/workload.yaml
        notExists:
          path: spec.template.metadata.labels["app.kubernetes.io/part-of"]

  - it: renders a PodDisruptionBudget for more than one replica
    set:
      dataobjCompactionWorker.enabled: true
      dataobjCompactionWorker.replicas: 2
      dataobjCompactionWorker.podDisruptionBudget.maxUnavailable: 1
    asserts:
      - template: dataobj-compaction-worker/pdb.yaml
        hasDocuments:
          count: 1
      - template: dataobj-compaction-worker/pdb.yaml
        equal:
          path: spec.maxUnavailable
          value: 1

  - it: does not render a PodDisruptionBudget for one replica
    set:
      dataobjCompactionWorker.enabled: true
      dataobjCompactionWorker.replicas: 1
      dataobjCompactionWorker.podDisruptionBudget.maxUnavailable: 1
    asserts:
      - template: dataobj-compaction-worker/pdb.yaml
        hasDocuments:
          count: 0

  - it: fails when the Loki image is older than 4.0
    set:
      loki.image.tag: 3.7.9
      dataobjCompactionWorker.enabled: true
      dataobjCompactionWorker.replicas: 2
    templates:
      - validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: dataobjCompactionWorker.enabled requires Loki 4.0.0 or later

  - it: checks the component image tag before the global one
    set:
      loki.image.tag: 3.7.9
      dataobjCompactionWorker.image.tag: 4.0.0
      dataobjCompactionWorker.enabled: true
      dataobjCompactionWorker.replicas: 2
    asserts:
      - template: dataobj-compaction-worker/workload.yaml
        hasDocuments:
          count: 1

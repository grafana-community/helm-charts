# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: results-cache PodDisruptionBudget
templates:
  - results-cache/pdb.yaml
set:
  deploymentMode: Distributed
  loki.useTestSchema: true
  loki.storage.bucketNames.chunks: chunks
  loki.storage.bucketNames.ruler: ruler
  memcached.enabled: true
  resultsCache.enabled: true
  resultsCache.replicas: 2
  resultsCache.podDisruptionBudget.maxUnavailable: 1
tests:
  - it: should omit null fields from PodDisruptionBudget spec
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable
      - notExists:
          path: spec.unhealthyPodEvictionPolicy

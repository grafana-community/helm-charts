deploymentMode: Distributed
loki:
  commonConfig:
    replication_factor: 1
  useTestSchema: true
  storage:
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
    type: s3
    s3:
      endpoint: rustfs:9000
      accessKeyId: rustfsadmin
      secretAccessKey: rustfsadmin
      s3ForcePathStyle: true
      insecure: true
  kedaAutoscaling:
    prometheusAddress: http://prometheus:9090
    customHeaders: X-Scope-OrgID=tenant1

# Disable scalable-mode targets
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
# Disable non-essential distributed components to speed up CI
compactor:
  replicas: 0
indexGateway:
  replicas: 0
ruler:
  replicas: 0
# Minimum components required for querier readiness
distributor:
  replicas: 1
  kedaAutoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    fallback:
      failureThreshold: 1
      replicas: 1
    triggers:
      - type: prometheus
        name: distributor_autoscaling_metric
        metadata:
          serverAddress: "{{ .Values.defaults.kedaAutoscaling.prometheusAddress }}"
          query: sum(rate(loki_distributor_bytes_received_total[2m]))
          threshold: "1000000"
          unsafeSsl: "{{ .Values.defaults.kedaAutoscaling.unsafeSsl }}"
          ignoreNullValues: "{{ .Values.defaults.kedaAutoscaling.ignoreNullValues }}"
          customHeaders: "{{ .Values.defaults.kedaAutoscaling.customHeaders }}"
          authModes: "{{ .Values.defaults.kedaAutoscaling.authentication.authModes }}"
ingester:
  replicas: 1
  zoneAwareReplication:
    enabled: false
queryFrontend:
  replicas: 1
queryScheduler:
  replicas: 1
querier:
  replicas: 1
  kedaAutoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 20
    # No Prometheus in CI — fall back to minReplicas immediately on trigger failure
    fallback:
      failureThreshold: 1
      replicas: 1

extraObjects:
  - apiVersion: v1
    kind: Service
    metadata:
      name: rustfs
    spec:
      selector:
        app: rustfs
      ports:
        - name: http
          port: 9000
          targetPort: 9000
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: rustfs
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: rustfs
      template:
        metadata:
          labels:
            app: rustfs
        spec:
          containers:
            - name: rustfs
              image: docker.io/rustfs/rustfs:1.0.0
              ports:
                - containerPort: 9000
                  name: http
              env:
                - name: RUSTFS_ACCESS_KEY
                  value: "rustfsadmin"
                - name: RUSTFS_SECRET_KEY
                  value: "rustfsadmin"
              volumeMounts:
                - name: data
                  mountPath: /data
              readinessProbe:
                httpGet:
                  path: /health
                  port: http
                periodSeconds: 10
              startupProbe:
                exec:
                  command:
                    - mkdir
                    - -p
                    - /data/chunks/
                    - /data/ruler/
                    - /data/admin/
                initialDelaySeconds: 1
                periodSeconds: 1
                failureThreshold: 10
          volumes:
            - name: data
              emptyDir: {}

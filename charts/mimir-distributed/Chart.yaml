apiVersion: v2
name: mimir-distributed
description: Helm chart for deploying Grafana Mimir in microservices mode.
type: application
appVersion: r419-18705415
version: 6.4.0
kubeVersion: ^1.32.0-0
home: https://grafana-community.github.io/helm-charts
sources:
  - https://github.com/grafana/mimir
  - https://grafana.com/oss/mimir/
  - https://grafana.com/docs/mimir/latest/
icon: https://grafana.com/static/img/logos/logo-mimir.svg
dependencies:
  - name: minio
    alias: minio
    version: 5.4.0
    repository: https://charts.min.io/
    condition: minio.enabled
  - name: grafana-agent-operator
    alias: grafana-agent-operator
    version: 0.5.2
    repository: https://grafana.github.io/helm-charts
    condition: metaMonitoring.grafanaAgent.installOperator
  - name: rollout-operator
    alias: rollout_operator
    repository: https://grafana.github.io/helm-charts
    version: 0.53.1
    condition: rollout_operator.enabled
maintainers:
  - name: Jan-Otto Kröpke
    email: github@jkroepke.de
    url: https://github.com/jkroepke
  - name: Quentin Bisson
    email: quentin.bisson@gmail.com
    url: https://github.com/QuentinBisson

# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: tempo-vulture scheduling
templates:
  - deployment.yaml
set:
  tempoAddress.push: http://distributor
  tempoAddress.query: http://query-frontend:3200
tests:
  - it: renders no affinity, priority class or topology spread constraints by default
    asserts:
      - notExists:
          path: spec.template.spec.affinity
      - notExists:
          path: spec.template.spec.priorityClassName
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: renders affinity, priority class and templated topology spread constraints
    release:
      name: tv
    set:
      priorityClassName: low
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values: [linux]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: "{{ .Release.Name }}"
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: low
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: kubernetes.io/os
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: tv

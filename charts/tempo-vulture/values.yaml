global:
  # -- Common labels for all object directly managed by this chart.
  # scope: *
  commonLabels: {}

# -- Overrides the chart's name
nameOverride: ""
# -- Overrides the chart's computed fullname
fullnameOverride: ""
# -- Image pull secrets for Docker images
imagePullSecrets: []
# -- hostAliases to add
hostAliases: []
#  - ip: 1.2.3.4
#    hostnames:
#      - domain.tld

image:
  # -- Docker image repository
  repository: docker.io/grafana/tempo-vulture
  # -- Overrides the image tag whose default is the chart's appVersion
  tag: ""
  # -- Docker image pull policy
  pullPolicy: IfNotPresent

# -- Number of replicas of Tempo Vulture
replicas: 1
# -- Common labels for all pods
podLabels: {}
# -- Common annotations for all pods
podAnnotations: {}
# -- Common annotations for the deployment and service
annotations: {}
# -- The number of old ReplicaSets to retain to allow rollback
revisionHistoryLimit: 10
# -- Additional CLI args for the vulture
extraArgs: []
# -- Environment variables to add to the vulture pods
extraEnv: []
# -- Environment variables from secrets or configmaps to add to the vulture pods
extraEnvFrom: []
# -- Resource requests and limits for the vulture
resources: {}
# -- Node selector for vulture pods
nodeSelector: {}
# -- Tolerations for vulture pods
tolerations: []
# -- Affinity for vulture pods
affinity: {}
# -- Topology spread constraints for vulture pods
topologySpreadConstraints: []
# -- Priority class name for vulture pods
priorityClassName: null

# -- SecurityContext holds container-level security attributes and common container settings.
# Vulture writes no files, so the root filesystem can be read-only.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
# -- podSecurityContext holds pod-level security attributes and common container settings.
# 10001 is the user and group the tempo-vulture image runs as.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# -- Mount the service account token into the vulture pod. Vulture does not call the Kubernetes API.
automountServiceAccountToken: false

serviceAccount:
  # -- Specifies whether a ServiceAccount should be created
  create: true
  # -- Automount API credentials for the ServiceAccount
  automountServiceAccountToken: false
  # -- The name of the ServiceAccount to use.
  # If not set and create is true, a name is generated using the fullname template
  name: null
  # -- Image pull secrets for the service account
  imagePullSecrets: []
  # -- Annotations for the service account
  annotations: {}

# PodMonitor configuration
podMonitor:
  # -- If enabled, PodMonitor resources for Prometheus Operator are created
  enabled: false
  # -- Alternative namespace for PodMonitor resources
  namespace: null
  # -- Namespace selector for PodMonitor resources
  namespaceSelector: {}
  # -- PodMonitor annotations
  annotations: {}
  # -- Additional PodMonitor labels
  labels: {}
  # -- PodMonitor scrape interval
  interval: null
  # -- PodMonitor scrape timeout in Go duration format (e.g. 15s)
  scrapeTimeout: null

prometheusRule:
  # -- Create a PrometheusRule (Prometheus Operator) with alerts on the vulture's own metrics.
  enabled: false
  # -- Alternative namespace for the PrometheusRule
  namespace: null
  # -- PrometheusRule annotations
  annotations: {}
  # -- Additional PrometheusRule labels, e.g. the labels your Prometheus selects rules by
  labels: {}
  # -- PromQL label matchers that select this vulture's series. Empty selects
  # `namespace="<release namespace>", pod=~"<fullname>-.*"`, the labels a PodMonitor scrape adds.
  # Set it when the vulture is scraped another way, e.g. `job="tempo-vulture"`.
  selector: ""
  # -- Labels added to every alert
  additionalRuleLabels: {}
  highErrorRate:
    # -- Alert when the share of traces the vulture wrote but could not read back correctly (not found by ID,
    # search, TraceQL or metrics, missing spans, wrong result, failed request) is above `threshold`.
    # Same expression as `TempoVultureHighErrorRate` in the upstream tempo-mixin, with a wider default `rateWindow`.
    enabled: true
    # -- Error ratio above which the alert fires
    threshold: 0.1
    # -- Rate window. The upstream mixin uses 1m because its vulture runs with 10s read and 5s search backoffs;
    # with this chart's defaults the vulture reads every 30s and searches every 60s, so a 1m window can hold
    # no reads, the ratio turns undefined and the alert's `for` restarts.
    rateWindow: 5m
    # -- How long the ratio must stay above the threshold
    for: 5m
    # -- Alert severity
    severity: critical
  notReporting:
    # -- Alert when no vulture metrics are scraped, for example when the vulture is not running or its
    # scrape fails. An error-rate alert cannot fire in that case, because there are no series to evaluate.
    enabled: true
    # -- How long the metrics must be missing
    for: 10m
    # -- Alert severity
    severity: warning

tempoAddress:
  # -- the URL towards your Tempo distributor, e.g. http://distributor
  push:
  # -- the URL towards your Tempo query-frontend, e.g. http://query-frontend:3200
  query:

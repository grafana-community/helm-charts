{{- with .Values.toolsConfig }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana-mcp.fullname" $ }}-tools
  namespace: {{ include "grafana-mcp.namespace" $ }}
  labels:
    {{- include "grafana-mcp.labels" $ | nindent 4 }}
  {{- with $.Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  tools.yaml: |
    {{- toYaml . | nindent 4 }}
{{- end }}

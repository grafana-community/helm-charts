{{- if or .Values.grafana.apiKey (and (not .Values.serverAuth.tokenSecret.name) (hasKey .Values.serverAuth "token")) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grafana-mcp.fullname" . }}
  namespace: {{ include "grafana-mcp.namespace" . }}
  labels:
    {{- include "grafana-mcp.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- with .Values.grafana.apiKey }}
  api-key: {{ . | toString | b64enc }}
  {{- end }}
  {{- if .Values.serverAuth.tokenSecret.name }}
  {{- else if .Values.serverAuth.token }}
  server-token: {{ .Values.serverAuth.token | toString | b64enc }}
  {{- else if hasKey .Values.serverAuth "token" }}
  server-token: {{ include "grafana-mcp.serverToken" . }}
  {{- end }}
{{- end }}

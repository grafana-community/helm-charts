# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: grafana-mcp security context
templates:
  - deployment.yaml
  - serviceaccount.yaml
tests:
  - it: should not mount a service account token by default
    # The pod-level field takes precedence over the ServiceAccount's own setting,
    # so both have to be false for the token to stay unmounted.
    templates:
      - deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: should not automount the token on the service account either
    templates:
      - serviceaccount.yaml
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: should set a RuntimeDefault seccomp profile on the pod and the container
    templates:
      - deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: should keep the restricted container security context defaults
    templates:
      - deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL

  - it: should still allow the token to be mounted when asked
    templates:
      - deployment.yaml
    set:
      automountServiceAccountToken: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

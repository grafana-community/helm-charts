# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: grafana-mcp poddisruptionbudget
templates:
  - poddisruptionbudget.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render minAvailable and match the deployment selector
    set:
      podDisruptionBudget:
        minAvailable: 1
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1
      - notExists:
          path: spec.maxUnavailable
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: grafana-mcp
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: mcp-server

  - it: should render maxUnavailable and unhealthyPodEvictionPolicy
    set:
      podDisruptionBudget:
        maxUnavailable: 50%
        unhealthyPodEvictionPolicy: AlwaysAllow
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 50%
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: AlwaysAllow
      - notExists:
          path: spec.minAvailable

# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: grafana-mcp secret
templates:
  - secret.yaml
tests:
  - it: should generate server-token by default
    asserts:
      - matchRegex:
          path: data.server-token
          pattern: ^[A-Za-z0-9+/=]{56}$
      - notExists:
          path: data.api-key

  - it: should not render secret when serverAuth.token is null
    set:
      serverAuth.token: null
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render secret by default when the Authorization header is forwarded
    set:
      env.GRAFANA_FORWARD_HEADERS: Authorization
    asserts:
      - hasDocuments:
          count: 0

  - it: should render only api-key when grafana.apiKey is set and the Authorization header is forwarded
    set:
      grafana.apiKey: a
      env.GRAFANA_FORWARD_HEADERS: Authorization
    asserts:
      - equal:
          path: data
          value:
            api-key: YQ==

  - it: should render server-token for an explicit token even when the Authorization header is forwarded
    set:
      env.GRAFANA_FORWARD_HEADERS: Authorization
      serverAuth.token: b
    asserts:
      - equal:
          path: data
          value:
            server-token: Yg==

  - it: should not render secret when serverAuth.tokenSecret.name is set
    set:
      serverAuth.tokenSecret.name: my-secret
      serverAuth.tokenSecret.key: token
    asserts:
      - hasDocuments:
          count: 0

  - it: should render only api-key when grafana.apiKey is set and serverAuth.token is null
    set:
      grafana.apiKey: a
      serverAuth.token: null
    asserts:
      - equal:
          path: data
          value:
            api-key: YQ==

  - it: should render api-key and generated server-token when only grafana.apiKey is set
    set:
      grafana.apiKey: a
    asserts:
      - equal:
          path: data.api-key
          value: YQ==
      - matchRegex:
          path: data.server-token
          pattern: ^[A-Za-z0-9+/=]{56}$

  - it: should render only server-token when serverAuth.token is set
    set:
      serverAuth.token: b
    asserts:
      - equal:
          path: data
          value:
            server-token: Yg==

  - it: should render both keys when both tokens are set
    set:
      grafana.apiKey: a
      serverAuth.token: b
    asserts:
      - equal:
          path: data
          value:
            api-key: YQ==
            server-token: Yg==

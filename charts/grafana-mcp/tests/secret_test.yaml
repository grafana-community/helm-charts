# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: grafana-mcp secret
templates:
  - secret.yaml
tests:
  - it: should not render secret by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render only api-key when grafana.apiKey is set
    set:
      grafana.apiKey: a
    asserts:
      - equal:
          path: data
          value:
            api-key: YQ==

  - it: should render only server-token when serverAuth.token is set
    set:
      serverAuth.token: b
    asserts:
      - equal:
          path: data
          value:
            server-token: Yg==

  - it: should render both keys when both tokens are set
    set:
      grafana.apiKey: a
      serverAuth.token: b
    asserts:
      - equal:
          path: data
          value:
            api-key: YQ==
            server-token: Yg==

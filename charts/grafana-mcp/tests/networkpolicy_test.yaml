# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: grafana-mcp networkpolicy
templates:
  - networkpolicy.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should allow ingress to the MCP port from any source and leave egress to other policies when egress is disabled
    set:
      networkPolicy:
        enabled: true
        egress:
          enabled: false
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: grafana-mcp
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: mcp-server
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
      - equal:
          path: spec.ingress
          value:
            - ports:
                - port: 8000
                  protocol: TCP
      - notExists:
          path: spec.egress

  - it: should also allow the separate metrics port
    set:
      networkPolicy:
        enabled: true
      metrics:
        enabled: true
        port: 9090
    asserts:
      - equal:
          path: spec.ingress[0].ports
          value:
            - port: 8000
              protocol: TCP
            - port: 9090
              protocol: TCP

  - it: should add extra ingress ports
    set:
      networkPolicy:
        enabled: true
        ingress:
          extraPorts:
            - port: 15008
              protocol: TCP
    asserts:
      - equal:
          path: spec.ingress[0].ports
          value:
            - port: 8000
              protocol: TCP
            - port: 15008
              protocol: TCP

  - it: should allow only clients and the listed sources when allowExternal is false
    set:
      networkPolicy:
        enabled: true
        ingress:
          allowExternal: false
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          ipBlocks:
            - 10.0.0.0/8
          from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: prometheus
    asserts:
      - equal:
          path: spec.ingress[0].from
          value:
            - podSelector:
                matchLabels:
                  RELEASE-NAME-grafana-mcp-client: "true"
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: monitoring
            - ipBlock:
                cidr: 10.0.0.0/8
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: prometheus

  - it: should restrict egress to DNS and the Grafana port by default
    set:
      networkPolicy:
        enabled: true
    asserts:
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
            - Egress
      - equal:
          path: spec.egress
          value:
            - ports:
                - port: 53
                  protocol: UDP
                - port: 53
                  protocol: TCP
            - ports:
                - port: 3000
                  protocol: TCP

  - it: should use 443 and Grafana's port 3000 for an https Grafana URL without a port
    set:
      grafana:
        url: https://grafana.example.com
      networkPolicy:
        enabled: true
        egress:
          enabled: true
    asserts:
      - equal:
          path: spec.egress[1].ports
          value:
            - port: 443
              protocol: TCP
            - port: 3000
              protocol: TCP

  - it: should allow the Service port and Grafana's pod port for an in-cluster URL without a port
    set:
      grafana:
        url: http://grafana.monitoring.svc
      networkPolicy:
        enabled: true
        egress:
          enabled: true
    asserts:
      - equal:
          path: spec.egress[1].ports
          value:
            - port: 80
              protocol: TCP
            - port: 3000
              protocol: TCP

  - it: should use the configured egress ports and destinations, and drop DNS when disabled
    set:
      networkPolicy:
        enabled: true
        egress:
          enabled: true
          allowDNS: false
          ports:
            - port: 3000
              protocol: TCP
          to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: grafana
    asserts:
      - equal:
          path: spec.egress
          value:
            - ports:
                - port: 3000
                  protocol: TCP
              to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: grafana

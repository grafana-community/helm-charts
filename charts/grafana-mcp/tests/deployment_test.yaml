# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: grafana-mcp deployment
templates:
  - deployment.yaml
tests:
  - it: should not render args by default
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args

  - it: should render --disable-write when it is the only args value set
    set:
      disableWrite: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --disable-write

  - it: should render --disable-write before extraArgs
    set:
      disableWrite: true
      extraArgs:
        - --transport=streamable-http
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --disable-write
            - --transport=streamable-http

  - it: should read generated MCP_GRAFANA_SERVER_TOKEN from chart-managed secret by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_GRAFANA_SERVER_TOKEN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-grafana-mcp
                key: server-token

  - it: should not render MCP_GRAFANA_SERVER_TOKEN when serverAuth.token is null
    set:
      serverAuth.token: null
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_GRAFANA_SERVER_TOKEN
          any: true

  - it: should not render MCP_GRAFANA_SERVER_TOKEN by default when the Authorization header is forwarded
    set:
      env.GRAFANA_FORWARD_HEADERS: X-Foo, authorization
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_GRAFANA_SERVER_TOKEN
          any: true

  - it: should render MCP_GRAFANA_SERVER_TOKEN when other headers are forwarded
    set:
      env.GRAFANA_FORWARD_HEADERS: X-Authorization-Id
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_GRAFANA_SERVER_TOKEN
          any: true

  - it: should render MCP_GRAFANA_SERVER_TOKEN for an explicit token even when the Authorization header is forwarded
    set:
      env.GRAFANA_FORWARD_HEADERS: Authorization
      serverAuth.token: caller-token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_GRAFANA_SERVER_TOKEN
          any: true

  - it: should render MCP_GRAFANA_SERVER_TOKEN for an existing secret even when the Authorization header is forwarded
    set:
      env.GRAFANA_FORWARD_HEADERS: Authorization
      serverAuth.tokenSecret.name: my-secret
      serverAuth.tokenSecret.key: token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_GRAFANA_SERVER_TOKEN
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: token

  - it: should read MCP_GRAFANA_SERVER_TOKEN from chart-managed secret
    set:
      serverAuth.token: caller-token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_GRAFANA_SERVER_TOKEN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-grafana-mcp
                key: server-token

  - it: should read MCP_GRAFANA_SERVER_TOKEN from existing secret
    set:
      serverAuth.tokenSecret.name: my-secret
      serverAuth.tokenSecret.key: token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_GRAFANA_SERVER_TOKEN
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: token

  - it: should not render --metrics-address or metrics port by default when metrics are enabled
    set:
      metrics.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --metrics
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
          any: true

  - it: should render --metrics-address and metrics container port when metrics.port is set
    set:
      metrics.enabled: true
      metrics.port: 9090
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --metrics
            - --metrics-address=:9090
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9090
            protocol: TCP

  - it: should ignore metrics.port when metrics are disabled
    set:
      metrics.port: 9090
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
          any: true

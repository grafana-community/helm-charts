# $schema: ./values.schema.json
# helm-schema-args: --schema-root.additional-properties=false

# @schema type:[string, null]
# -- Override the chart name
nameOverride: ""

# @schema type:[string, null]
# -- Override the full name of the resources
fullnameOverride: ""

# @schema type:[string, null]
# -- Override the namespace of the resources (defaults to the release namespace)
namespaceOverride: ""

# @schema additionalProperties:{"type":"string"}
# -- Extra labels added to all resources
extraLabels: {}

# @schema type:[integer, null]
# -- Number of replicas for the MCP server. Ignored when `hpa.enabled` is true.
replicas: 1

# @schema type:[integer, null]
# -- Number of old ReplicaSets to retain for rollbacks
revisionHistoryLimit: 10

# @schema skipProperties:true;additionalProperties:true
# -- Deployment strategy
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

# -- PodDisruptionBudget for the MCP server. Set `minAvailable` or `maxUnavailable` to enable it.
podDisruptionBudget: {}
#  minAvailable: 1
#  maxUnavailable: 1
#  unhealthyPodEvictionPolicy: IfHealthyBudget

# -- Image configuration
image:
  # -- The Docker registry
  registry: docker.io
  # -- The Docker repository
  repository: grafana/mcp-grafana
  # -- Image tag
  tag: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Image pull secrets
imagePullSecrets: []

# -- Grafana connection configuration
grafana:
  # -- Grafana URL (should point to the main Grafana service)
  url: "http://grafana:3000"
  # -- Grafana ApiKey (if not using a secret)
  apiKey: ""
  # -- Secret containing the Grafana API key
  apiKeySecret:
    # -- Name of the secret containing the API key
    name: ""
    # -- Key within the secret that contains the API key
    key: ""

# -- Caller authentication for the MCP HTTP endpoint (sets `MCP_GRAFANA_SERVER_TOKEN`).
# Clients must send `Authorization: Bearer <token>`.
# If neither `token` nor `tokenSecret.name` is set, a random token is generated and reused on upgrade.
# Set `token: null` to disable authentication. `tokenSecret.name` takes precedence over `token`.
# No token is generated if `env.GRAFANA_FORWARD_HEADERS` contains `Authorization`, because mcp-grafana
# refuses to start when the Authorization header is both forwarded and used for caller authentication.
serverAuth:
  # @schema type:[string, null]
  # -- Bearer token (if not using a secret). Leave empty to generate one (unless the Authorization header is forwarded), set to `null` to disable.
  token: ""
  # -- Secret containing the bearer token
  tokenSecret:
    # -- Name of the secret containing the bearer token
    name: ""
    # -- Key within the secret that contains the bearer token
    key: ""

# -- Enable debug mode
debug: false

# @schema item:string
# -- Categories to disable (e.g., oncall, incident, sift)
disabledCategories: []

# -- Disable write operations to Grafana
disableWrite: false

# -- Additional command line arguments
extraArgs: []

# -- Override the container entrypoint command
command: []

# -- Environment variables
env: {}

# -- Environment variables from other sources
envValueFrom: {}

# -- Environment variables from ConfigMaps or Secrets
envFrom: []

# -- MCP server Readiness probe configuration
readinessProbe: {}
#

# -- MCP server Liveness probe configuration
livenessProbe: {}

# -- MCP server Startup probe configuration
startupProbe: {}

# -- Service account Configuration
serviceAccount:
  # -- Enable service account
  create: true
  # -- Name of the service account
  name: ""
  # @schema additionalProperties:{"type":"string"}
  # -- Annotations for the service account
  annotations: {}
  # @schema additionalProperties:{"type":"string"}
  # -- Labels for the service account
  labels: {}
  # -- Automount service account token
  automountServiceAccountToken: false

# -- Service configuration
service:
  # -- Enable service
  enabled: true
  # @schema enum:[ClusterIP, NodePort, LoadBalancer, ExternalName]
  # -- Service type
  type: ClusterIP
  # -- Service port
  port: 8000
  # @schema additionalProperties:{"type":"string"}
  # -- Service annotations
  annotations: {}
  # @schema additionalProperties:{"type":"string"}
  # -- Service labels
  labels: {}
  # -- Cluster IP (if type is ClusterIP)
  clusterIP: ""
  # -- External IPs
  externalIPs: []
  # -- Load balancer IP
  loadBalancerIP: ""
  # -- Load balancer source ranges
  loadBalancerSourceRanges: []
  # -- External name (if type is ExternalName)
  externalName: ""
  # @schema type:[integer, string]
  # -- Node port (if type is NodePort or LoadBalancer)
  nodePort: ""
  # -- Extra ports
  extraPorts: []
  # -- Session affinity
  sessionAffinity: ""
  # -- Session affinity config
  sessionAffinityConfig: {}

# -- Ingress configuration
ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # @schema additionalProperties:{"type":"string"}
  # -- Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Ingress hosts
  hosts:
    - host: mcp-grafana.local
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
  #  - secretName: mcp-grafana-tls
  #    hosts:
  #      - mcp-grafana.local
  # @schema additionalProperties:{"type":"string"}
  # -- Ingress labels
  labels: {}

# -- Configure the gateway routes for the chart here.
# More routes can be added by adding a dictionary key like the 'main' route.
# [[ref]](https://gateway-api.sigs.k8s.io/references/spec/#gateway.networking.k8s.io%2fv1)
route:
  main:
    # -- Enables or disables the route
    enabled: false

    # -- Set the route apiVersion, e.g. gateway.networking.k8s.io/v1 or gateway.networking.k8s.io/v1beta1
    # If not set, the latest available version will be auto-detected
    apiVersion: ""
    # @schema enum:[GRPCRoute, HTTPRoute, TCPRoute, TLSRoute, UDPRoute]
    # -- Set the route kind
    # Valid options are GRPCRoute, HTTPRoute, TCPRoute, TLSRoute, UDPRoute
    kind: HTTPRoute

    # @schema additionalProperties:{"type":"string"}
    # -- Route annotations
    annotations: {}
    # @schema additionalProperties:{"type":"string"}
    # -- Route labels
    labels: {}

    # -- Hostnames for the route
    hostnames: []
    # - mcp-grafana.example.com

    # -- Parent references (gateway to attach to)
    parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-namespace

    # -- Matches define conditions for matching incoming requests
    matches:
      - path:
          type: PathPrefix
          value: /

    # -- Timeouts define the timeouts that can be configured for an HTTP request.
    # Ref. https://gateway-api.sigs.k8s.io/api-types/httproute/#timeouts-optional
    timeouts: {}
    # request: 10s
    # backendRequest: 5s

    # -- Filters define the filters that are applied to requests that match this rule.
    filters: []

    # -- Additional custom rules that can be added to the route
    additionalRules: []

    # -- httpsRedirect adds a filter for redirecting to https (HTTP 301 Moved Permanently).
    # To redirect HTTP traffic to HTTPS, you need to have a Gateway with both HTTP and HTTPS listeners.
    # Matches and filters do not take effect if enabled.
    # Ref. https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/
    httpsRedirect: false

# -- Resource requests and limits
resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 250m
  #   memory: 256Mi

# @schema skipProperties:true;additionalProperties:true
# -- Container security context
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# @schema skipProperties:true;additionalProperties:true
# -- Pod security context
securityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Automount the service account token into the pod. This takes precedence over
# `serviceAccount.automountServiceAccountToken`, so it must also be false for the
# token to stay unmounted. grafana-mcp only talks to the Grafana HTTP API and never
# calls the Kubernetes API, so it does not need a token.
automountServiceAccountToken: false

# -- Node selector
nodeSelector: {}

# -- Tolerations
tolerations: []

# -- Affinity
affinity: {}

# -- Topology spread constraints
topologySpreadConstraints: []

# -- Priority class name
priorityClassName: ""

# -- Runtime class name
runtimeClassName: ""

# -- Scheduler name
schedulerName: ""

# @schema type:[integer, string, null]
# -- Termination grace period in seconds (defaults to Kubernetes' default of 30s when unset)
terminationGracePeriodSeconds: ""

# -- Host aliases
hostAliases: []

# -- DNS policy
dnsPolicy: ""

# -- DNS config
dnsConfig: {}

# @schema additionalProperties:{"type":"string"}
# -- Pod annotations
podAnnotations: {}

# @schema additionalProperties:{"type":"string"}
# -- Pod labels
podLabels: {}

# @schema additionalProperties:{"type":"string"}
# -- Deployment annotations
annotations: {}

# @schema additionalProperties:{"type":"string"}
# -- Deployment labels
labels: {}

# -- Lifecycle hooks
lifecycle: {}

# -- Volume mounts
volumeMounts: []

# -- Volumes
volumes: []

# -- Init containers
initContainers: []

# -- Extra init containers
extraInitContainers: []

# -- Extra containers
extraContainers: []

# -- Metrics configuration
metrics:
  # -- Enable Prometheus metrics endpoint (adds --metrics flag)
  enabled: false
  # @schema type:[integer, string, null]
  # -- Serve metrics on a separate port (adds `--metrics-address=:<port>`). The port is exposed on the
  # container and the Service as `metrics` and scraped by the ServiceMonitor. Unlike the MCP port, the
  # separate listener does not enforce Host/Origin validation. Leave empty to serve metrics on the MCP port.
  port: ""

# -- ServiceMonitor configuration for Prometheus Operator
serviceMonitor:
  # -- Enable ServiceMonitor
  enabled: false
  # @schema additionalProperties:{"type":"string"}
  # -- ServiceMonitor labels
  labels: {}
  # @schema additionalProperties:{"type":"string"}
  # -- ServiceMonitor annotations
  annotations: {}
  # -- Scrape interval
  interval: 30s
  # -- Scrape timeout
  scrapeTimeout: 10s
  # -- Metrics path
  path: /metrics
  # -- Service port name to scrape. Defaults to `metrics` when `metrics.port` is set, otherwise `mcp-http`
  port: ""
  # -- Additional relabelings
  relabelings: []
  # -- Additional metric relabelings
  metricRelabelings: []
  # -- Namespace selector
  namespaceSelector: {}

# -- Horizontal Pod Autoscaler configuration
hpa:
  # -- Enable HPA
  enabled: false
  # -- Minimum number of replicas
  minReplicas: 1
  # -- Maximum number of replicas
  maxReplicas: 10
  # @schema type:[integer, null]
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80
  # @schema type:[integer, null]
  # -- Target memory utilization percentage
  targetMemoryUtilizationPercentage: null
  # -- Additional metrics
  metrics: []
  # -- Behavior configuration
  behavior: {}
  # @schema additionalProperties:{"type":"string"}
  # -- Annotations
  annotations: {}
  # @schema additionalProperties:{"type":"string"}
  # -- Labels
  labels: {}

{{- if .Values.metricsGenerator.enabled }}
{{- $replicas := .Values.metricsGenerator.replicas }}
{{- if .Values.metricsGenerator.autoscaling.enabled }}
{{- $replicas = .Values.metricsGenerator.autoscaling.minReplicas }}
{{- end }}
{{- if and (gt (int $replicas) 1) .Values.metricsGenerator.podDisruptionBudget.enabled }}
{{ $dict := dict "ctx" . "component" "metrics-generator" "memberlist" true }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tempo.resourceName" $dict }}
  labels:
    {{- include "tempo.labels" $dict | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      {{- include "tempo.selectorLabels" $dict | nindent 6 }}
  maxUnavailable: {{ .Values.metricsGenerator.maxUnavailable }}
  {{- with .Values.metricsGenerator.podDisruptionBudget.unhealthyPodEvictionPolicy }}
  unhealthyPodEvictionPolicy: {{ . }}
  {{- end }}
{{- end }}
{{- end }}

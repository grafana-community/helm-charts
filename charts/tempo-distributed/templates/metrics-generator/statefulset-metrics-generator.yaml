{{- if and (.Values.metricsGenerator.enabled) (eq .Values.metricsGenerator.kind "StatefulSet") }}
{{ $dict := dict "ctx" . "component" "metrics-generator" "memberlist" true }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tempo.resourceName" $dict }}
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "tempo.labels" $dict | nindent 4 }}
  {{- with .Values.metricsGenerator.annotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  minReadySeconds: {{ .Values.metricsGenerator.minReadySeconds }}
  replicas: {{ .Values.metricsGenerator.replicas }}
  podManagementPolicy: Parallel
  updateStrategy:
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      {{- include "tempo.selectorLabels" $dict | nindent 6 }}
  serviceName: {{ include "tempo.governingServiceName" (dict "ctx" $ "component" "metrics-generator") }}
  template:
    {{- include "tempo.podTemplate" (dict
        "ctx" .
        "component" .Values.metricsGenerator
        "target" "metrics-generator"
        "persistence" .Values.metricsGenerator.persistence
        "dataVolumeName" "wal"
        "dataEmptyDir" .Values.metricsGenerator.walEmptyDir
        "ports" .Values.metricsGenerator.ports) | nindent 4 }}
  {{- with include "tempo.statefulset.volumeClaimTemplates" (dict "ctx" $ "component" .Values.metricsGenerator "name" "wal") | trim }}
  {{- . | nindent 2 }}
  {{- end }}
{{- end }}

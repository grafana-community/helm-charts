blockBuilder:
  replicas: 1

liveStore:
  replicas: 1

ingest:
  kafka:
    address: "kafka.kafka-ci.svc.cluster.local:9094"
    auto_create_topic_default_partitions: 1
    sasl:
      mechanism: SCRAM-SHA-512
      existingSecret: tempo-kafka-scram

traces:
  otlp:
    http:
      enabled: true

tests:
  integration:
    enabled: true

apiVersion: v1
kind: Namespace
metadata:
  name: kafka-ci
---
# 9092 is PLAINTEXT. 9094 only accepts SASL SCRAM-SHA-512, as user tempo
# (tempo-kafka-scram Secret below). SCRAM users exist only once storage is
# formatted with --add-scram, which the image's env-driven startup cannot do.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: kafka-ci
data:
  server.properties: |
    node.id=1
    process.roles=broker,controller
    listeners=PLAINTEXT://:9092,CONTROLLER://:9093,SASL_PLAINTEXT://:9094
    advertised.listeners=PLAINTEXT://kafka.kafka-ci.svc.cluster.local:9092,SASL_PLAINTEXT://kafka.kafka-ci.svc.cluster.local:9094
    controller.listener.names=CONTROLLER
    listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
    inter.broker.listener.name=PLAINTEXT
    controller.quorum.voters=1@localhost:9093
    listener.name.sasl_plaintext.sasl.enabled.mechanisms=SCRAM-SHA-512
    listener.name.sasl_plaintext.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
    log.dirs=/var/lib/kafka/data
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    group.initial.rebalance.delay.ms=0
    auto.create.topics.enable=true
---
apiVersion: v1
kind: Namespace
metadata:
  name: tempo-distributed
---
apiVersion: v1
kind: Secret
metadata:
  name: tempo-kafka-scram
  namespace: tempo-distributed
stringData:
  username: tempo
  password: tempo-ci-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: kafka-ci
  labels:
    ci-managed: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        ci-managed: "true"
    spec:
      containers:
        - name: kafka
          image: docker.io/apache/kafka:4.3.2
          command:
            - bash
            - -ec
            - |
              /opt/kafka/bin/kafka-storage.sh format -c /config/server.properties \
                -t "$(/opt/kafka/bin/kafka-storage.sh random-uuid)" \
                --add-scram 'SCRAM-SHA-512=[name=tempo,password=tempo-ci-secret]' \
                --ignore-formatted
              exec /opt/kafka/bin/kafka-server-start.sh /config/server.properties
          ports:
            - containerPort: 9092
              name: plaintext
            - containerPort: 9094
              name: sasl-scram
          env:
            # Bound heap prevents the JVM from requesting memory beyond this limit.
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx256m -Xms256m"
          # Guaranteed CPU/memory keeps the broker responsive during chart upgrade when
          # 10+ Tempo pods restart simultaneously; without requests the JVM gets throttled
          # and block-builder/live-store exhaust their 10-retry Kafka connection limit.
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
          # tcpSocket avoids running kafka-broker-api-versions.sh (JVM-heavy) on every probe
          # tick; under upgrade CPU pressure the exec probe times out (default 1s) and pulls
          # Kafka out of service endpoints after 30 failures, causing block-builder to get
          # connection refused on the ClusterIP.
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            - name: config
              mountPath: /config
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: kafka-config
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka-ci
spec:
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: sasl-scram
      port: 9094
      targetPort: 9094
---
apiVersion: v1
kind: Namespace
metadata:
  name: minio-ci
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio-ci
  labels:
    ci-managed: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        ci-managed: "true"
    spec:
      containers:
        - name: minio
          image: docker.io/pgsty/minio:RELEASE.2026-04-17T00-00-00Z
          # A directory under the data root is served as a bucket.
          command:
            - sh
            - -ec
            - mkdir -p /data/tempo-traces && exec minio server /data
          ports:
            - containerPort: 9000
              name: s3
          env:
            - name: MINIO_ROOT_USER
              value: "grafana-tempo"
            - name: MINIO_ROOT_PASSWORD
              value: "supersecret"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio-ci
spec:
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: Namespace
metadata:
  name: rustfs-ci
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: rustfs-ci
  labels:
    ci-managed: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
        ci-managed: "true"
    spec:
      containers:
        - name: rustfs
          image: docker.io/rustfs/rustfs:1.0.0-beta.8
          ports:
            - containerPort: 9000
              name: s3
          env:
            - name: RUSTFS_ACCESS_KEY
              value: "rustfsadmin"
            - name: RUSTFS_SECRET_KEY
              value: "rustfsadmin"
          volumeMounts:
            - name: data
              mountPath: /data
          # A directory under the data root is served as a bucket.
          startupProbe:
            exec:
              command:
                - mkdir
                - -p
                - /data/tempo-traces
            initialDelaySeconds: 1
            periodSeconds: 1
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: rustfs-ci
spec:
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: 9000

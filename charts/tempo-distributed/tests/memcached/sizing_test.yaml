# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: memcached sizing flags
templates:
  - memcached/statefulset-memcached.yaml
  - memcached/statefulset-memcached-bloom.yaml
  - configmap-tempo.yaml

tests:
  - it: shared memcached gets the default sizing flags
    template: memcached/statefulset-memcached.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - -m 1024
            - -I 5m
            - -c 4096

  - it: other extraArgs render after the sizing flags
    template: memcached/statefulset-memcached.yaml
    set:
      memcached.extraArgs:
        - -v
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - -m 1024
            - -I 5m
            - -c 4096
            - -v

  - it: false sizing values omit the flags and the args key
    template: memcached/statefulset-memcached.yaml
    set:
      memcached.allocatedMemory: false
      memcached.maxItemMemory: false
      memcached.connectionLimit: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args

  - it: per-role memcached uses its own sizing values
    template: memcached/statefulset-memcached-bloom.yaml
    set:
      memcachedBloom.enabled: true
      memcachedBloom.allocatedMemory: 2048
      memcachedBloom.maxItemMemory: 8
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - -m 2048
            - -I 8m
            - -c 4096

  - it: shared cache entry gets max_item_size from maxItemMemory
    template: configmap-tempo.yaml
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "max_item_size: 5242880"

  - it: per-role cache entry gets max_item_size from its own maxItemMemory
    template: configmap-tempo.yaml
    set:
      memcachedBloom.enabled: true
      memcachedBloom.maxItemMemory: 8
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "max_item_size: 8388608"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "max_item_size: 5242880"

  - it: false maxItemMemory omits max_item_size
    template: configmap-tempo.yaml
    set:
      memcached.maxItemMemory: false
    asserts:
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "max_item_size"

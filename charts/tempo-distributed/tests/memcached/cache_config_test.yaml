# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: cache config generation
templates:
  - configmap-tempo.yaml

tests:
  - it: default - single shared entry covering all three roles
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "host: .*-memcached\n"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "parquet-footer"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "bloom"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "frontend-search"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "memcached-bloom"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "memcached-parquet-footer"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "memcached-frontend-search"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "parquet-page"

  - it: bloom enabled - bloom gets its own cluster, shared handles remaining roles
    set:
      memcachedBloom.enabled: true
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "host: .*-memcached\n"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "memcached-bloom"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "parquet-footer"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "frontend-search"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "memcached-parquet-footer"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "memcached-frontend-search"

  - it: parquet-footer enabled - parquet-footer gets its own cluster
    set:
      memcachedParquetFooter.enabled: true
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "memcached-parquet-footer"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "bloom"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "frontend-search"

  - it: frontend-search enabled - frontend-search gets its own cluster
    set:
      memcachedFrontendSearch.enabled: true
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "memcached-frontend-search"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "bloom"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "parquet-footer"

  - it: all three enabled - each role has its own cluster, no shared entry
    set:
      memcachedBloom.enabled: true
      memcachedParquetFooter.enabled: true
      memcachedFrontendSearch.enabled: true
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "memcached-bloom"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "memcached-parquet-footer"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "memcached-frontend-search"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "host: .*-memcached\n"

  - it: custom timeout respected for bloom
    set:
      memcachedBloom.enabled: true
      memcachedBloom.timeout: 1s
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "timeout: 1s"

  - it: custom timeout respected for parquet-footer
    set:
      memcachedParquetFooter.enabled: true
      memcachedParquetFooter.timeout: 2s
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "timeout: 2s"

  - it: custom timeout respected for frontend-search
    set:
      memcachedFrontendSearch.enabled: true
      memcachedFrontendSearch.timeout: 750ms
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "timeout: 750ms"

  - it: shared disabled, all three enabled - per-role entries, no shared entry
    set:
      memcached.enabled: false
      memcachedBloom.enabled: true
      memcachedParquetFooter.enabled: true
      memcachedFrontendSearch.enabled: true
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "host: .*-memcached-bloom\n"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "host: .*-memcached-parquet-footer\n"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "host: .*-memcached-frontend-search\n"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "host: .*-memcached\n"

  - it: shared disabled, only bloom enabled - bloom entry only, no shared entry
    set:
      memcached.enabled: false
      memcachedBloom.enabled: true
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "host: .*-memcached-bloom\n"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "host: .*-memcached\n"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "memcached-parquet-footer"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "memcached-frontend-search"

  - it: nothing enabled - the user-supplied cache block is passed through verbatim
    set:
      memcached.enabled: false
      cache:
        caches:
          - memcached:
              host: external-memcached.example.svc
              service: memcached-client
            roles:
              - parquet-footer
              - bloom
              - frontend-search
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "host: external-memcached.example.svc"

  - it: shared disabled, bloom enabled - user cache entries still serve the remaining roles
    set:
      memcached.enabled: false
      memcachedBloom.enabled: true
      cache:
        caches:
          - memcached:
              host: external-memcached.example.svc
              service: memcached-client
              max_idle_conns: 64
            roles:
              - parquet-footer
              - bloom
              - frontend-search
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "host: .*-memcached-bloom\n"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "host: external-memcached.example.svc\n\\s+max_idle_conns: 64\n\\s+service: memcached-client\n\\s+roles:\n\\s+- parquet-footer\n\\s+- frontend-search\n"

  - it: parquet-page enabled - pages get their own cluster, the shared one keeps the other roles
    set:
      memcachedParquetPage.enabled: true
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "host: .*-memcached\n\\s+max_item_size: 5242880\n\\s+service: memcached-client\n\\s+timeout: 500ms\n\\s+roles:\n\\s+- parquet-footer\n\\s+- bloom\n\\s+- frontend-search\n"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "host: .*-memcached-parquet-page\n\\s+max_item_size: 5242880\n\\s+service: memcached-client\n\\s+timeout: 500ms\n\\s+roles:\n\\s+- parquet-page\n"

  - it: custom timeout respected for parquet-page
    set:
      memcachedParquetPage.enabled: true
      memcachedParquetPage.timeout: 3s
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "timeout: 3s"

  - it: shared disabled, parquet-page enabled - user cache entries drop parquet-page
    set:
      memcached.enabled: false
      memcachedParquetPage.enabled: true
      cache:
        caches:
          - memcached:
              host: external-memcached.example.svc
              service: memcached-client
            roles:
              - parquet-footer
              - parquet-page
              - bloom
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "host: external-memcached.example.svc\n\\s+service: memcached-client\n\\s+roles:\n\\s+- parquet-footer\n\\s+- bloom\n"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "host: .*-memcached-parquet-page\n"

  - it: shared disabled, bloom enabled - user cache entries keep parquet-page without its own cluster
    set:
      memcached.enabled: false
      memcachedBloom.enabled: true
      cache:
        caches:
          - memcached:
              host: external-memcached.example.svc
              service: memcached-client
            roles:
              - parquet-footer
              - parquet-page
              - bloom
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "host: external-memcached.example.svc\n\\s+service: memcached-client\n\\s+roles:\n\\s+- parquet-footer\n\\s+- parquet-page\n"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "memcached-parquet-page"

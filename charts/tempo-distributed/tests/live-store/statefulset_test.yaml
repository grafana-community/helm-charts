# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: live-store StatefulSet
templates:
  - live-store/statefulset-live-store.yaml
  - configmap-tempo.yaml

tests:
  - it: renders a StatefulSet with correct name and kind by default
    template: live-store/statefulset-live-store.yaml
    asserts:
      - equal:
          path: kind
          value: StatefulSet
      - equal:
          path: metadata.name
          value: RELEASE-NAME-tempo-live-store

  - it: does not render when disabled
    template: live-store/statefulset-live-store.yaml
    set:
      liveStore.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: replica count matches liveStore.replicas
    template: live-store/statefulset-live-store.yaml
    set:
      liveStore.replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: renders memberlist and http-metrics ports
    template: live-store/statefulset-live-store.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 7946
            name: http-memberlist
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 3200
            name: http-metrics
            protocol: TCP

  - it: uses tempo.podSecurityContext when no component override is set
    template: live-store/statefulset-live-store.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: global.priorityClassName is used when no component override
    template: live-store/statefulset-live-store.yaml
    set:
      global.priorityClassName: high-priority
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: high-priority

  - it: data volume is an emptyDir and no volumeClaimTemplates when persistence is disabled (default)
    template: live-store/statefulset-live-store.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}
      - notExists:
          path: spec.volumeClaimTemplates

  - it: uses a custom walEmptyDir spec for the data volume when persistence is disabled
    template: live-store/statefulset-live-store.yaml
    set:
      liveStore.walEmptyDir:
        sizeLimit: 2Gi
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir:
              sizeLimit: 2Gi

  - it: renders a data volumeClaimTemplate when persistence is enabled
    template: live-store/statefulset-live-store.yaml
    set:
      liveStore.persistence.enabled: true
      liveStore.persistence.size: 8Gi
      liveStore.persistence.storageClass: standard
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: data
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
          value: ReadWriteOnce
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 8Gi
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: standard
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}

  - it: renders persistentVolumeClaimRetentionPolicy when enabled
    template: live-store/statefulset-live-store.yaml
    set:
      liveStore.persistence.enabled: true
      liveStore.persistentVolumeClaimRetentionPolicy.enabled: true
      liveStore.persistentVolumeClaimRetentionPolicy.whenDeleted: Delete
      liveStore.persistentVolumeClaimRetentionPolicy.whenScaled: Retain
    asserts:
      - equal:
          path: spec.persistentVolumeClaimRetentionPolicy.whenDeleted
          value: Delete
      - equal:
          path: spec.persistentVolumeClaimRetentionPolicy.whenScaled
          value: Retain

  - it: renders a volumeClaimTemplate per zone StatefulSet when zone-aware + persistence enabled
    template: live-store/statefulset-live-store.yaml
    set:
      rollout_operator.enabled: true
      liveStore.zoneAwareReplication.enabled: true
      liveStore.persistence.enabled: true
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: data

  - it: renders a RAM disk and no volumeClaimTemplates when persistence.inMemory is true
    template: live-store/statefulset-live-store.yaml
    set:
      liveStore.persistence.enabled: true
      liveStore.persistence.inMemory: true
      liveStore.persistence.size: 2Gi
    asserts:
      - notExists:
          path: spec.volumeClaimTemplates
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir:
              medium: Memory
              sizeLimit: 2Gi

# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: ingest config generation
templates:
  - configmap-tempo.yaml

tests:
  - it: sets ingest.enabled=true when kafka address is configured
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "enabled: true"

  - it: omits ingest block when no kafka address is configured
    asserts:
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "^  ingest:"

  - it: omits sasl mechanism when not configured
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
    asserts:
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "sasl_mechanism"

  - it: fails when sasl credentials are set directly but configStorageType is not Secret
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: SCRAM-SHA-512
      ingest.kafka.sasl.username: myuser
      ingest.kafka.sasl.password: mypassword
    asserts:
      - failedTemplate:
          errorMessage: "ingest.kafka.sasl is configuring credentials directly (not via existingSecret), but configStorageType is not Secret. Either set ingest.kafka.sasl.existingSecret (recommended) or set configStorageType=Secret."

  - it: succeeds when mechanism is PLAIN with no credentials (SASL disabled)
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: PLAIN
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "sasl_mechanism: PLAIN"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "sasl_username|sasl_password"

  - it: fails when mechanism is SCRAM-SHA-256 with no credentials
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: SCRAM-SHA-256
    asserts:
      - failedTemplate:
          errorMessage: "ingest.kafka.sasl.mechanism SCRAM-SHA-256 requires credentials: set ingest.kafka.sasl.existingSecret or username/password"

  - it: fails when mechanism is SCRAM-SHA-512 with no credentials
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: SCRAM-SHA-512
    asserts:
      - failedTemplate:
          errorMessage: "ingest.kafka.sasl.mechanism SCRAM-SHA-512 requires credentials: set ingest.kafka.sasl.existingSecret or username/password"

  - it: fails when only one of username/password is set
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      configStorageType: Secret
      ingest.kafka.sasl.mechanism: PLAIN
      ingest.kafka.sasl.username: myuser
    asserts:
      - failedTemplate:
          errorMessage: "ingest.kafka.sasl: username and password must both be set"

  - it: succeeds when sasl credentials are set directly and configStorageType is Secret
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: SCRAM-SHA-512
      ingest.kafka.sasl.username: myuser
      ingest.kafka.sasl.password: mypassword
      configStorageType: Secret
    asserts:
      # configStorageType=Secret renders tempo.yaml base64-encoded, so decode before matching.
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_mechanism: SCRAM-SHA-512"

  - it: omits username/password from tempo.yaml when sasl uses existingSecret
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: SCRAM-SHA-512
      ingest.kafka.sasl.existingSecret: kafka-scram-credentials
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "sasl_mechanism: SCRAM-SHA-512"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "sasl_username|sasl_password"

  - it: ignores literal username/password when existingSecret is also set
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: SCRAM-SHA-512
      ingest.kafka.sasl.existingSecret: kafka-scram-credentials
      ingest.kafka.sasl.username: myuser
      ingest.kafka.sasl.password: mypassword
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "sasl_mechanism: SCRAM-SHA-512"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "myuser|mypassword"

  - it: fails when the sasl mechanism is not one of the allowed values
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: INVALID
      configStorageType: Secret
    asserts:
      - failedTemplate:
          errorMessage: "ingest.kafka.sasl.mechanism \"INVALID\" is invalid, must be one of: PLAIN, SCRAM-SHA-256, SCRAM-SHA-512, OAUTHBEARER, AWS_MSK_IAM"

  - it: sets sasl mechanism to SCRAM-SHA-512 when configured
    set:
      configStorageType: Secret
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: SCRAM-SHA-512
      ingest.kafka.sasl.username: myuser
      ingest.kafka.sasl.password: mypassword
    asserts:
      # configStorageType=Secret renders tempo.yaml base64-encoded, so decode before matching.
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_mechanism: SCRAM-SHA-512"

  - it: renders inline credentials when mechanism is PLAIN
    set:
      configStorageType: Secret
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: PLAIN
      ingest.kafka.sasl.username: myuser
      ingest.kafka.sasl.password: mypassword
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_mechanism: PLAIN"
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_username: myuser"
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_password: mypassword"

  - it: renders inline credentials when mechanism is SCRAM-SHA-256
    set:
      configStorageType: Secret
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: SCRAM-SHA-256
      ingest.kafka.sasl.username: myuser
      ingest.kafka.sasl.password: mypassword
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_mechanism: SCRAM-SHA-256"
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_username: myuser"

  - it: sets tls enabled to true when configured
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.tls.enabled: true
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "tls_enabled: true"

  - it: renders oauthbearer options when mechanism is OAUTHBEARER
    set:
      configStorageType: Secret
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: OAUTHBEARER
      ingest.kafka.sasl.oauthbearer.token: my-oauth-token
      ingest.kafka.sasl.oauthbearer.zid: my-authz-id
      ingest.kafka.sasl.oauthbearer.extensions:
        traceID: abc123
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_mechanism: OAUTHBEARER"
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_oauthbearer_token: my-oauth-token"
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_oauthbearer_zid: my-authz-id"
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "traceID: abc123"

  - it: renders oauthbearer filePath when mechanism is OAUTHBEARER
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: OAUTHBEARER
      ingest.kafka.sasl.oauthbearer.filePath: /etc/kafka/oauth/token.json
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "sasl_oauthbearer_file_path: \"?/etc/kafka/oauth/token.json"

  - it: renders oauthbearer httpSocketPath options when mechanism is OAUTHBEARER
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: OAUTHBEARER
      ingest.kafka.sasl.oauthbearer.httpSocketPath: /run/kafka/oauth.sock
      ingest.kafka.sasl.oauthbearer.httpSocketTimeout: 10s
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "sasl_oauthbearer_http_socket_path: \"?/run/kafka/oauth.sock"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "sasl_oauthbearer_http_socket_timeout: 10s"

  - it: fails when oauthbearer has no credential source
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: OAUTHBEARER
    asserts:
      - failedTemplate:
          errorMessage: "ingest.kafka.sasl.oauthbearer: exactly one of existingSecret/token, filePath or httpSocketPath must be set (got: none)"

  - it: fails when oauthbearer existingSecret is combined with filePath
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: OAUTHBEARER
      ingest.kafka.sasl.oauthbearer.existingSecret: kafka-oauth-token
      ingest.kafka.sasl.oauthbearer.filePath: /etc/kafka/oauth/token.json
    asserts:
      - failedTemplate:
          errorMessage: "ingest.kafka.sasl.oauthbearer: exactly one of existingSecret/token, filePath or httpSocketPath must be set (got: existingSecret/token, filePath)"

  - it: fails when oauthbearer filePath is combined with httpSocketPath
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: OAUTHBEARER
      ingest.kafka.sasl.oauthbearer.filePath: /etc/kafka/oauth/token.json
      ingest.kafka.sasl.oauthbearer.httpSocketPath: /run/kafka/oauth.sock
    asserts:
      - failedTemplate:
          errorMessage: "ingest.kafka.sasl.oauthbearer: exactly one of existingSecret/token, filePath or httpSocketPath must be set (got: filePath, httpSocketPath)"

  - it: does not render username/password when mechanism is OAUTHBEARER
    set:
      configStorageType: Secret
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: OAUTHBEARER
      ingest.kafka.sasl.oauthbearer.token: my-oauth-token
    asserts:
      - notMatchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_username"
      - notMatchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_password"

  - it: omits oauthbearer token from tempo.yaml when oauthbearer uses existingSecret
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: OAUTHBEARER
      ingest.kafka.sasl.oauthbearer.existingSecret: kafka-oauth-token
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "sasl_mechanism: OAUTHBEARER"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "sasl_oauthbearer_token"

  - it: ignores literal oauthbearer token when existingSecret is also set
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: OAUTHBEARER
      ingest.kafka.sasl.oauthbearer.existingSecret: kafka-oauth-token
      ingest.kafka.sasl.oauthbearer.token: my-oauth-token
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "sasl_mechanism: OAUTHBEARER"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "my-oauth-token"

  - it: renders aws_msk_iam static credential options when mechanism is AWS_MSK_IAM
    set:
      configStorageType: Secret
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: AWS_MSK_IAM
      ingest.kafka.sasl.mskIam.accessKey: AKIAEXAMPLE
      ingest.kafka.sasl.mskIam.secretKey: secretkeyvalue
      ingest.kafka.sasl.mskIam.sessionToken: sessiontokenvalue
      ingest.kafka.sasl.mskIam.userAgent: tempo
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_mechanism: AWS_MSK_IAM"
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_msk_iam_access_key: AKIAEXAMPLE"
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_msk_iam_secret_key: secretkeyvalue"
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_msk_iam_session_token: sessiontokenvalue"
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_msk_iam_user_agent: tempo"

  - it: renders aws_msk_iam filePath when mechanism is AWS_MSK_IAM
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: AWS_MSK_IAM
      ingest.kafka.sasl.mskIam.filePath: /etc/kafka/aws/credentials.json
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "sasl_msk_iam_file_path: \"?/etc/kafka/aws/credentials.json"

  - it: renders aws_msk_iam httpSocketPath options when mechanism is AWS_MSK_IAM
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: AWS_MSK_IAM
      ingest.kafka.sasl.mskIam.httpSocketPath: /run/kafka/aws.sock
      ingest.kafka.sasl.mskIam.httpSocketTimeout: 10s
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "sasl_msk_iam_http_socket_path: \"?/run/kafka/aws.sock"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "sasl_msk_iam_http_socket_timeout: 10s"

  - it: fails when aws_msk_iam has no credential source
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: AWS_MSK_IAM
      ingest.kafka.sasl.mskIam.userAgent: tempo
    asserts:
      - failedTemplate:
          errorMessage: "ingest.kafka.sasl.mskIam: exactly one of existingSecret/accessKey+secretKey, filePath or httpSocketPath must be set (got: none). Tempo does not use the AWS default credential chain (e.g. IRSA)."

  - it: fails when aws_msk_iam existingSecret is combined with httpSocketPath
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: AWS_MSK_IAM
      ingest.kafka.sasl.mskIam.existingSecret: kafka-msk-credentials
      ingest.kafka.sasl.mskIam.httpSocketPath: /run/kafka/aws.sock
    asserts:
      - failedTemplate:
          errorMessage: "ingest.kafka.sasl.mskIam: exactly one of existingSecret/accessKey+secretKey, filePath or httpSocketPath must be set (got: existingSecret/accessKey+secretKey, httpSocketPath)"

  - it: fails when only one of aws_msk_iam accessKey/secretKey is set
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      configStorageType: Secret
      ingest.kafka.sasl.mechanism: AWS_MSK_IAM
      ingest.kafka.sasl.mskIam.accessKey: AKIAEXAMPLE
    asserts:
      - failedTemplate:
          errorMessage: "ingest.kafka.sasl.mskIam: accessKey and secretKey must both be set"

  - it: does not render username/password when mechanism is AWS_MSK_IAM
    set:
      configStorageType: Secret
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: AWS_MSK_IAM
      ingest.kafka.sasl.mskIam.accessKey: AKIAEXAMPLE
      ingest.kafka.sasl.mskIam.secretKey: secretkeyvalue
    asserts:
      - notMatchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_username"
      - notMatchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_password"

  - it: omits aws_msk_iam credentials from tempo.yaml when existingSecret is set
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: AWS_MSK_IAM
      ingest.kafka.sasl.mskIam.existingSecret: kafka-msk-credentials
      ingest.kafka.sasl.mskIam.sessionTokenKey: session-token
      ingest.kafka.sasl.mskIam.userAgent: tempo
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "sasl_mechanism: AWS_MSK_IAM"
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "sasl_msk_iam_user_agent: \"?tempo"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "sasl_msk_iam_access_key|sasl_msk_iam_secret_key|sasl_msk_iam_session_token"

  - it: ignores literal msk_iam static credentials when existingSecret is also set
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: AWS_MSK_IAM
      ingest.kafka.sasl.mskIam.existingSecret: kafka-msk-credentials
      ingest.kafka.sasl.mskIam.accessKey: AKIAEXAMPLE
      ingest.kafka.sasl.mskIam.secretKey: secretkeyvalue
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: "sasl_mechanism: AWS_MSK_IAM"
      - notMatchRegex:
          path: data["tempo.yaml"]
          pattern: "AKIAEXAMPLE|secretkeyvalue"

  - it: combines TLS with OAUTHBEARER when both are configured
    set:
      configStorageType: Secret
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: OAUTHBEARER
      ingest.kafka.sasl.oauthbearer.token: my-oauth-token
      ingest.kafka.tls.enabled: true
      ingest.kafka.tls.caPath: /etc/kafka/tls/ca.crt
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_mechanism: OAUTHBEARER"
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "tls_enabled: true"
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "tls_ca_path: /etc/kafka/tls/ca.crt"

  - it: renders username/password as PLAIN when mechanism is empty
    set:
      configStorageType: Secret
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.username: myuser
      ingest.kafka.sasl.password: mypassword
    asserts:
      - matchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_username: myuser"
      - notMatchRegex:
          path: data["tempo.yaml"]
          decodeBase64: true
          pattern: "sasl_mechanism"

  - it: fails when oauthbearer is configured but mechanism is not OAUTHBEARER
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: SCRAM-SHA-512
      ingest.kafka.sasl.existingSecret: kafka-credentials
      ingest.kafka.sasl.oauthbearer.filePath: /var/run/token.json
    asserts:
      - failedTemplate:
          errorMessage: "ingest.kafka.sasl.oauthbearer is configured, but mechanism is SCRAM-SHA-512; set ingest.kafka.sasl.mechanism=OAUTHBEARER"

  - it: fails when mskIam is configured but mechanism is empty
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mskIam.existingSecret: msk-credentials
    asserts:
      - failedTemplate:
          errorMessage: "ingest.kafka.sasl.mskIam is configured, but mechanism is PLAIN; set ingest.kafka.sasl.mechanism=AWS_MSK_IAM"

  - it: fails when username/password credentials are set for OAUTHBEARER
    set:
      ingest.kafka.address: kafka.kafka-ci.svc.cluster.local:9092
      ingest.kafka.sasl.mechanism: OAUTHBEARER
      ingest.kafka.sasl.existingSecret: kafka-credentials
      ingest.kafka.sasl.oauthbearer.filePath: /var/run/token.json
    asserts:
      - failedTemplate:
          errorMessage: "ingest.kafka.sasl.existingSecret/username/password only apply to PLAIN and SCRAM-SHA-*, but mechanism is OAUTHBEARER"

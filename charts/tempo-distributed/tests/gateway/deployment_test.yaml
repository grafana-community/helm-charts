# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: gateway Deployment
templates:
  - gateway/deployment-gateway.yaml
  - gateway/configmap-gateway.yaml
set:
  gateway.enabled: true

tests:
  - it: renders no lifecycle hooks and no update strategy by default
    template: gateway/deployment-gateway.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].lifecycle
      - notExists:
          path: spec.strategy

  - it: renders gateway.lifecycle on the nginx container
    template: gateway/deployment-gateway.yaml
    set:
      gateway.lifecycle:
        preStop:
          sleep:
            seconds: 15
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: nginx
      - equal:
          path: spec.template.spec.containers[0].lifecycle
          value:
            preStop:
              sleep:
                seconds: 15

  - it: renders gateway.strategy on the Deployment
    template: gateway/deployment-gateway.yaml
    set:
      gateway.strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0

  - it: defaults to soft node and soft zone anti-affinity
    template: gateway/deployment-gateway.yaml
    asserts:
      - notExists:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.labelSelector.matchLabels["app.kubernetes.io/component"]
          value: gateway
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[1].weight
          value: 75
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[1].podAffinityTerm.topologyKey
          value: topology.kubernetes.io/zone

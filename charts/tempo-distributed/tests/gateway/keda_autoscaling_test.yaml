# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: gateway KEDA autoscaling
templates:
  - lib/keda.tpl
  - gateway/hpa.yaml
  - gateway/keda-scaledObject.yaml
set:
  ingest.kafka.address: kafka:9092
tests:
  - it: renders the HPA and no ScaledObject when only autoscaling is enabled
    set:
      gateway.enabled: true
      gateway.autoscaling.enabled: true
    asserts:
      - hasDocuments:
          count: 1
        template: gateway/hpa.yaml
      - hasDocuments:
          count: 0
        template: gateway/keda-scaledObject.yaml

  - it: renders a ScaledObject instead of the HPA when KEDA is enabled
    set:
      gateway.enabled: true
      gateway.autoscaling.enabled: true
      gateway.autoscaling.minReplicas: 2
      gateway.autoscaling.maxReplicas: 8
      gateway.autoscaling.keda.enabled: true
      gateway.autoscaling.keda.cooldownPeriod: 120
      gateway.autoscaling.keda.triggers:
        - type: prometheus
          metadata:
            serverAddress: http://prometheus:9090
            threshold: "10"
            query: sum(rate(tempo_request_duration_seconds_count[1m]))
    asserts:
      - hasDocuments:
          count: 0
        template: gateway/hpa.yaml
      - equal:
          path: kind
          value: ScaledObject
        template: gateway/keda-scaledObject.yaml
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: Deployment
            name: RELEASE-NAME-tempo-gateway
        template: gateway/keda-scaledObject.yaml
      - equal:
          path: spec.minReplicaCount
          value: 2
        template: gateway/keda-scaledObject.yaml
      - equal:
          path: spec.maxReplicaCount
          value: 8
        template: gateway/keda-scaledObject.yaml
      - equal:
          path: spec.cooldownPeriod
          value: 120
        template: gateway/keda-scaledObject.yaml
      - equal:
          path: spec.triggers[0].metadata.query
          value: sum(rate(tempo_request_duration_seconds_count[1m]))
        template: gateway/keda-scaledObject.yaml

  - it: renders neither when autoscaling is disabled, even with KEDA enabled
    set:
      gateway.enabled: true
      gateway.autoscaling.keda.enabled: true
      gateway.autoscaling.keda.triggers:
        - type: cpu
          metricType: Utilization
          metadata:
            value: "60"
    asserts:
      - hasDocuments:
          count: 0
        template: gateway/hpa.yaml
      - hasDocuments:
          count: 0
        template: gateway/keda-scaledObject.yaml

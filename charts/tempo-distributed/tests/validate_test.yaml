# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: render-time validation
templates:
  - validate.yaml

tests:
  - it: fails when the removed minio subchart is enabled
    set:
      minio.enabled: true
      ingest.kafka.address: kafka:9092
    asserts:
      - failedTemplate:
          errorMessage: "The built-in MinIO subchart has been removed from the tempo-distributed chart, so the minio.* values are no longer honored. Deploy MinIO (or any S3-compatible object store) externally and configure storage.trace.s3 to point at it, then remove the minio block from your values. See UPGRADE.md for a migration path that preserves your existing MinIO data."

  - it: fails when blockBuilder is enabled without a kafka address
    set:
      blockBuilder.enabled: true
      liveStore.enabled: false
      ingest.kafka.address: ""
    asserts:
      - failedTemplate:
          errorMessage: "ingest.kafka.address is required when blockBuilder or liveStore is enabled. Tempo 3.0 uses a Kafka-backed write path: block-builder and live-store consume spans from Kafka and will not start without a broker. Set ingest.kafka.address to your Kafka broker (e.g. \"kafka.kafka-namespace.svc.cluster.local:9092\"), or disable blockBuilder and liveStore. See UPGRADE.md for details."

  - it: fails when liveStore is enabled without a kafka address
    set:
      blockBuilder.enabled: false
      liveStore.enabled: true
      ingest.kafka.address: ""
    asserts:
      - failedTemplate:
          errorMessage: "ingest.kafka.address is required when blockBuilder or liveStore is enabled. Tempo 3.0 uses a Kafka-backed write path: block-builder and live-store consume spans from Kafka and will not start without a broker. Set ingest.kafka.address to your Kafka broker (e.g. \"kafka.kafka-namespace.svc.cluster.local:9092\"), or disable blockBuilder and liveStore. See UPGRADE.md for details."

  - it: renders nothing when kafka is configured and minio is unset
    set:
      ingest.kafka.address: kafka:9092
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when the kafka write path is disabled
    set:
      blockBuilder.enabled: false
      liveStore.enabled: false
      ingest.kafka.address: ""
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when zone-aware live-stores have no rollout-operator
    set:
      ingest.kafka.address: kafka:9092
      liveStore.zoneAwareReplication.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: needs a rollout-operator in this namespace

  - it: renders nothing when the rollout-operator is installed by the chart
    set:
      ingest.kafka.address: kafka:9092
      rollout_operator.enabled: true
      liveStore.zoneAwareReplication.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when the rollout-operator is managed outside the chart
    set:
      ingest.kafka.address: kafka:9092
      liveStore.zoneAwareReplication.enabled: true
      liveStore.zoneAwareReplication.rolloutOperatorManagedExternally: true
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when noDownscale and prepareDownscale are both set
    set:
      ingest.kafka.address: kafka:9092
      rollout_operator.enabled: true
      liveStore.zoneAwareReplication.enabled: true
      liveStore.zoneAwareReplication.noDownscale: true
      liveStore.zoneAwareReplication.prepareDownscale.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: mutually exclusive

  - it: fails when a downscale setting is used without zone-awareness
    set:
      ingest.kafka.address: kafka:9092
      liveStore.zoneAwareReplication.prepareDownscale.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: only apply to zone-aware live-stores

  - it: fails when the rollout-operator webhooks are turned off
    set:
      ingest.kafka.address: kafka:9092
      rollout_operator.enabled: true
      rollout_operator.webhooks.enabled: false
      liveStore.zoneAwareReplication.enabled: true
      liveStore.zoneAwareReplication.prepareDownscale.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: rollout-operator admission webhooks

  - it: fails when the cluster domain is not passed to the rollout-operator
    set:
      ingest.kafka.address: kafka:9092
      global.clusterDomain: custom.local
      rollout_operator.enabled: true
      liveStore.zoneAwareReplication.enabled: true
      liveStore.zoneAwareReplication.prepareDownscale.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: cluster-domain=custom.local

  - it: accepts a cluster domain passed to the rollout-operator
    set:
      ingest.kafka.address: kafka:9092
      global.clusterDomain: custom.local
      rollout_operator.enabled: true
      rollout_operator.extraArgs:
        - -cluster-domain=custom.local
      liveStore.zoneAwareReplication.enabled: true
      liveStore.zoneAwareReplication.prepareDownscale.enabled: true
    asserts:
      - hasDocuments:
          count: 0
